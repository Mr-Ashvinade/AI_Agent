<!DOCTYPE html>
<html>
<head>
    <title>Ashu AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top left, #1e3a8a, #0f172a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .app {
            width: 900px;
            height: 600px;
            display: flex;
            border-radius: 25px;
            backdrop-filter: blur(25px);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(0,0,0,0.3);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 90px;
            border-radius: 50%;
            box-shadow: 0 0 25px #3b82f6;
        }

        .profile h2 {
            margin: 15px 0 5px 0;
            font-weight: 500;
        }

        .status {
            font-size: 13px;
            color: #22c55e;
        }

        .menu button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(59,130,246,0.5);
        }

        /* Chat */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            background: rgba(0,0,0,0.2);
        }

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 12px 18px;
            border-radius: 20px;
            margin: 10px 0;
            max-width: 65%;
            animation: fade 0.3s ease;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
        }

        .bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            padding: 20px;
            display: flex;
            background: rgba(0,0,0,0.2);
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
        }

        button.send {
            margin-left: 15px;
            padding: 14px 20px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button.send:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="app">

    <div class="sidebar">
        <div>
            <div class="profile">
                <img src="https://i.imgur.com/6VBx3io.png">
                <h2>Ashu</h2>
                <div class="status">● AI Connected</div>
            </div>

            <div class="menu">
                <button onclick="quickPrompt('Help me improve my resume')">Resume Help</button>
                <button onclick="quickPrompt('Create a study plan')">Study Plan</button>
                <button onclick="quickPrompt('Plan my career growth')">Career</button>
                <button onclick="quickPrompt('Teach me stock trading')">Trading</button>
            </div>
        </div>

        <div style="font-size:12px; text-align:center; opacity:0.6;">
            Ashu AI • 2026 Edition
        </div>
    </div>

    <div class="chat">
        <div class="header">🚀 Personal AI Assistant</div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="handleKey(event)">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
function handleKey(event) {
    if (event.key === "Enter") sendMessage();
}

function quickPrompt(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
}

function addMessage(text, className) {
    const msg = document.createElement("div");
    msg.className = "message " + className;
    msg.innerText = text;
    document.getElementById("messages").appendChild(msg);
    document.getElementById("messages").scrollTop =
        document.getElementById("messages").scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
    });

    const data = await response.json();
    addMessage(data.response, "bot");
}
</script>

</body>
</html>
